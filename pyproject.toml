[project]
name = "ecg_data"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate",
    "datasets",
    "h5py",
    "huggingface-hub",
    "matplotlib",
    "maturin",
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "torch",
    "tqdm",
    "transformers",
    "wfdb",
    "flash-linear-attention[cuda]==0.5.1",
    "causal-conv1d>=1.6.2.post1",
    "kernels",
    "bitsandbytes",
]

[tool.uv]
override-dependencies = ["triton==3.3.1"]


[[tool.uv.index]]
name = "astral-cu128"
url = "https://wheels.astral.sh/simple/cu128/"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
causal-conv1d = { index = "astral-cu128" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ecg_data", "ecg_data.*"]
namespaces = false
