defaults:
  - ./software_v_human_agh.yaml

experiment: llm_edits
development: true # Print and pause after each pair; false enables batches.
reports_per_batch: 8 # Concurrent OpenRouter requests or one HF generation batch.
resume_from: null # Existing run directory; null starts a new run.

study_options:
  empty_reports: exclude
  # remove: ["machine results only - see ed notes for md interpretation."] # Case-insensitive phrases; remove only matching statements.
  remove: [] # Case-insensitive phrases; remove only matching statements.
  truncate: ["when compared to the prior tracing of,", "when compared with ecg of", "no previous ecgs available", "no prior tracing for comparison", "no previous tracing for comparison"]

plots:
  run_id: 20261014T154559105558Z

llm:
  backend: huggingface # openrouter | huggingface
  # model: nvidia/nemotron-3-ultra-550b-a55b:free # Set your OpenRouter model ID (provider/model).
  # model: xiaomi/mimo-v2.6-pro
  model: Qwen/Qwen3.8-27B # For huggingface, use an HF model ID or local directory.
  max_attempts: 3 # Total attempts per changed pair, including the first call.
  # device_map: auto # HF placement across visible GPUs; respects CUDA_VISIBLE_DEVICES.
  # OpenRouter only; Hugging Face uses the model's generation defaults.
  temperature: 0
  max_tokens: 1024
  timeout: 120 # Seconds per HTTP request.
